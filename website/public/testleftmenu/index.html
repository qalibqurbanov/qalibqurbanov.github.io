<!doctype html>
<html lang="az" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Left menu redesigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@property --ang { syntax: "<angle>"; inherits: true; initial-value: 115deg; }
@property --p { syntax: "<length>"; inherits: true; initial-value: 0px; }
:root { --bg:#0a0a12; --surface:#11111c; --border:#2a2a40; --accent:#00e5ff; --accent2:#ff2e97; --violet:#8b5cf6; --text:#e9e9f5; --muted:#9494b0; --card:rgba(255,255,255,.035); --line:rgba(255,255,255,.08); }
:root[data-theme="light"] { --bg:#f5f4fb; --surface:#fff; --border:#d8d6e8; --accent:#0096b8; --accent2:#d4007c; --text:#15151f; --muted:#5d5b78; --card:rgba(255,255,255,.75); --line:rgba(0,0,0,.09); }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--text); font-family:"Exo 2",system-ui,sans-serif; min-height:100vh;
  background-image:radial-gradient(60% 40% at 10% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),radial-gradient(60% 40% at 95% 100%,color-mix(in srgb,var(--accent2) 12%,transparent),transparent 70%); background-attachment:fixed; }
header { max-width:1500px; margin:0 auto; padding:40px 24px 6px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
h1 { font-size:28px; font-weight:600; letter-spacing:-.01em; } header p { margin-top:6px; color:var(--muted); font-size:14px; max-width:70ch; }
.theme { cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted); font:500 12px "JetBrains Mono",monospace; padding:8px 14px; border-radius:999px; }
.grid { max-width:1500px; margin:0 auto; padding:24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:28px 22px; }
figure { margin:0; } figcaption { display:flex; gap:10px; align-items:baseline; padding:0 4px 10px; font-size:13px; color:var(--muted); }
figcaption b { font:500 11px "JetBrains Mono",monospace; color:var(--accent); letter-spacing:.08em; } figcaption span { color:var(--text); font-weight:500; }

/* ---- the card, same bones as the real sidebar ---- */
.side { height:760px; border-radius:24px; border:1px solid var(--border); background:var(--card); backdrop-filter:blur(14px); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); padding:22px 24px 16px; display:flex; flex-direction:column; position:relative; overflow:hidden; }
.head { display:flex; flex-direction:column; align-items:center; text-align:center; }
.ava { width:84px; height:84px; border-radius:50%; padding:3px; background:conic-gradient(from 140deg,var(--accent),var(--accent2),var(--accent)); }
.ava i { display:grid; place-items:center; width:100%; height:100%; border-radius:50%; background:radial-gradient(circle at 35% 30%,#7a4a3a,#2a1a1a 70%); font:600 26px "Exo 2"; font-style:normal; color:#f1d9c8; }
.name { margin-top:10px; font:600 27px/1.15 "Exo 2"; letter-spacing:-.025em; background-image:repeating-linear-gradient(var(--ang),var(--text) var(--p),var(--text) calc(var(--p) + 190px),var(--accent) calc(var(--p) + 250px),var(--violet) calc(var(--p) + 300px),var(--accent2) calc(var(--p) + 350px),var(--text) calc(var(--p) + 420px)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:slide 7s linear infinite,turn 30s linear infinite; }
@keyframes slide { to { --p:420px; } } @keyframes turn { to { --ang:360deg; } }
.sub { margin-top:6px; font:400 10.5px "JetBrains Mono",monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.acts { margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:256px; }
.act { display:flex; align-items:center; justify-content:center; gap:8px; height:36px; border-radius:6px; font:500 11px "JetBrains Mono",monospace; letter-spacing:.14em; text-transform:uppercase; }
.act.a { background:color-mix(in srgb,var(--accent) 9%,transparent); color:var(--accent); } .act.b { background:color-mix(in srgb,var(--accent2) 9%,transparent); color:var(--accent2); }
.mid { flex:1; min-height:0; display:flex; flex-direction:column; margin:14px 0 8px; }
.foot { border-top:1px solid var(--line); padding-top:10px; display:flex; flex-direction:column; gap:8px; }
.soc { display:flex; justify-content:center; gap:20px; color:var(--muted); font:500 11px "JetBrains Mono",monospace; } .copy { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
svg.i { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none; }
a { color:inherit; text-decoration:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.g { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
@media (prefers-reduced-motion:reduce) { .name { animation:none; } }

/* ---- 01 Index list: numbers, hairlines, rows share the whole height ---- */
.m1 ul { flex:1; list-style:none; padding:0; display:flex; flex-direction:column; border-bottom:1px solid var(--line); }
.m1 li { flex:1; border-top:1px solid var(--line); display:flex; }
.m1 li a { flex:1; display:grid; grid-template-columns:34px 1fr 20px; align-items:center; color:var(--muted); font:500 17px "Exo 2"; transition:.3s; }
.m1 .no { font:400 11px "JetBrains Mono"; letter-spacing:.1em; opacity:.6; } .m1 .ar { opacity:0; transform:translateX(-6px); transition:.3s; }
.m1 li a:hover { color:var(--text); } .m1 li a:hover .ar { opacity:.7; transform:none; }
.m1 li.on a { color:var(--text); } .m1 li.on .no { color:var(--accent); opacity:1; } .m1 li.on .ar { opacity:1; transform:none; color:var(--accent2); } .m1 li.on .lb { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:600; }

/* ---- 02 Two-line items: icon chip, title and a note ---- */
.m2 ul { flex:1; list-style:none; padding:0; display:flex; flex-direction:column; justify-content:space-between; gap:4px; }
.m2 li a { display:grid; grid-template-columns:40px 1fr; gap:14px; align-items:center; padding:9px 10px; border-radius:14px; transition:.3s; color:var(--muted); }
.m2 .chip { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.04); border:1px solid var(--line); transition:.3s; }
.m2 b { display:block; font:500 16px "Exo 2"; color:var(--text); opacity:.8; } .m2 small { display:block; margin-top:2px; font:400 11.5px "Exo 2"; color:var(--muted); }
.m2 li a:hover { background:rgba(255,255,255,.04); } .m2 li.on a { background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent); }
.m2 li.on .chip { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0a0a12; border-color:transparent; box-shadow:0 0 18px -4px var(--accent); } .m2 li.on b { opacity:1; }

/* ---- 03 Big type ---- */
.m3 ul { flex:1; list-style:none; padding:0 4px; display:flex; flex-direction:column; justify-content:center; gap:6px; }
.m3 li a { display:flex; align-items:baseline; gap:10px; font:600 30px/1.25 "Exo 2"; letter-spacing:-.02em; color:var(--text); opacity:.32; transition:.35s; }
.m3 sup { font:400 10px "JetBrains Mono"; letter-spacing:.1em; color:var(--accent); opacity:0; transition:.3s; align-self:flex-start; margin-top:10px; }
.m3 li a:hover { opacity:.75; } .m3 li.on a { opacity:1; } .m3 li.on sup, .m3 li a:hover sup { opacity:1; } .m3 li.on .lb { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }

/* ---- 04 Status block + compact menu + learning ---- */
.m4 .stat { border:1px solid var(--line); border-radius:16px; padding:12px 14px; display:grid; gap:8px; background:rgba(255,255,255,.025); }
.m4 .row { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--muted); } .m4 .row b { color:var(--text); font-weight:500; }
.m4 .live { display:inline-flex; align-items:center; gap:8px; color:#2ee6a6; font:500 11px "JetBrains Mono"; letter-spacing:.1em; text-transform:uppercase; } .m4 .live i { width:7px; height:7px; border-radius:50%; background:#2ee6a6; box-shadow:0 0 10px #2ee6a6; animation:pulse 1.8s ease-out infinite; }
@keyframes pulse { 50% { opacity:.35; } }
.m4 ul { list-style:none; padding:0; margin:14px 0 0; display:grid; gap:2px; }
.m4 li a { display:grid; grid-template-columns:22px 1fr 8px; gap:12px; align-items:center; height:40px; padding:0 12px; border-radius:10px; font:500 15px "Exo 2"; color:var(--muted); transition:.3s; } .m4 li a:hover { color:var(--text); background:rgba(255,255,255,.04); }
.m4 li.on a { color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,transparent); } .m4 li.on a::after { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
.m4 .learn { margin-top:auto; border:1px dashed var(--line); border-radius:14px; padding:12px 14px; } .m4 .learn small { font:400 10px "JetBrains Mono"; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:8px; }
.m4 .tags { display:flex; gap:6px; flex-wrap:wrap; } .m4 .tags span { font:400 11px "JetBrains Mono"; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--text); }

/* ---- 05 Tiles ---- */
.m5 ul { flex:1; list-style:none; padding:0; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:10px; }
.m5 li:last-child { grid-column:1 / -1; }
.m5 li a { height:100%; border-radius:18px; border:1px solid var(--line); background:rgba(255,255,255,.03); display:flex; flex-direction:column; justify-content:space-between; padding:14px; transition:.3s; color:var(--muted); }
.m5 li a svg.i { width:24px; height:24px; } .m5 b { font:500 15px "Exo 2"; color:var(--text); } .m5 small { font:400 10px "JetBrains Mono"; letter-spacing:.1em; opacity:.6; }
.m5 li a:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--accent) 40%,transparent); }
.m5 li.on a { background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent2) 14%,transparent)); border-color:color-mix(in srgb,var(--accent) 50%,transparent); color:var(--accent); }

/* ---- 06 Timeline ---- */
.m6 ul { flex:1; list-style:none; padding:0 0 0 22px; position:relative; display:flex; flex-direction:column; justify-content:space-between; }
.m6 ul::before { content:""; position:absolute; left:6px; top:14px; bottom:14px; width:1px; background:linear-gradient(180deg,var(--accent),var(--violet),var(--accent2)); opacity:.45; }
.m6 li { position:relative; } .m6 li::before { content:""; position:absolute; left:-21px; top:9px; width:9px; height:9px; border-radius:50%; background:var(--surface); border:1px solid var(--muted); transition:.3s; }
.m6 li a { display:block; padding:4px 0; color:var(--muted); } .m6 b { display:block; font:500 17px "Exo 2"; transition:.3s; } .m6 small { font:400 11.5px "Exo 2"; opacity:.7; }
.m6 li a:hover b { color:var(--text); } .m6 li.on::before { background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent),0 0 14px var(--accent); }
.m6 li.on b { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:600; }

/* ---- 07 Stats + counters + tags ---- */
.m7 .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .m7 .st { border:1px solid var(--line); border-radius:14px; padding:10px 6px; text-align:center; background:rgba(255,255,255,.025); } .m7 .st b { display:block; font:600 20px "Exo 2"; } .m7 .st small { font:400 9px "JetBrains Mono"; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
.m7 ul { list-style:none; padding:0; margin:14px 0 0; display:flex; flex-direction:column; gap:3px; flex:1; justify-content:space-between; }
.m7 li a { display:grid; grid-template-columns:22px 1fr auto; gap:12px; align-items:center; height:42px; padding:0 12px; border-radius:12px; color:var(--muted); font:500 15.5px "Exo 2"; transition:.3s; } .m7 em { font:400 10.5px "JetBrains Mono"; font-style:normal; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.06); }
.m7 li a:hover { color:var(--text); background:rgba(255,255,255,.04); } .m7 li.on a { color:var(--text); background:rgba(255,255,255,.07); box-shadow:inset 0 1px 0 rgba(255,255,255,.12); } .m7 li.on em { background:var(--accent); color:#0a0a12; }
.m7 .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; } .m7 .tags span { font:400 10.5px "JetBrains Mono"; padding:3px 9px; border-radius:6px; background:rgba(255,255,255,.05); color:var(--muted); }

/* ---- 08 Glass rows with chips ---- */
.m8 ul { flex:1; list-style:none; padding:0; display:flex; flex-direction:column; justify-content:space-between; gap:8px; }
.m8 li { flex:1; max-height:64px; } .m8 li a { height:100%; display:grid; grid-template-columns:36px 1fr 16px; gap:14px; align-items:center; padding:0 14px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--muted); font:500 16px "Exo 2"; transition:.3s; }
.m8 .chip { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line); }
.m8 li a:hover { transform:translateX(4px); color:var(--text); } .m8 li.on a { color:var(--text); background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent),color-mix(in srgb,var(--accent2) 10%,transparent)); border-color:color-mix(in srgb,var(--accent) 45%,transparent); }
.m8 li.on .chip { background:var(--accent); color:#0a0a12; border-color:transparent; } .m8 .ch { opacity:.4; font-size:18px; line-height:1; } .m8 li.on .ch { opacity:1; color:var(--accent2); }

/* ---- 09 Editorial ---- */
.m9 .cap { display:flex; justify-content:space-between; font:400 10px "JetBrains Mono"; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); padding-bottom:10px; border-bottom:1px solid var(--text); }
.m9 ul { flex:1; list-style:none; padding:0; display:flex; flex-direction:column; }
.m9 li { flex:1; border-bottom:1px solid var(--line); display:flex; } .m9 li a { flex:1; display:flex; align-items:center; justify-content:space-between; color:var(--muted); font:500 22px "Exo 2"; letter-spacing:-.015em; transition:.3s; }
.m9 .pl { font:300 22px "Exo 2"; transition:.4s; opacity:.5; } .m9 li a:hover { color:var(--text); padding-left:6px; } .m9 li.on a { color:var(--text); } .m9 li.on .pl { transform:rotate(45deg); color:var(--accent2); opacity:1; } .m9 li.on { background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 7%,transparent)); }
.m9 .cap2 { margin-top:10px; display:flex; justify-content:space-between; font:400 10px "JetBrains Mono"; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; }

/* ---- 10 Command bar ---- */
.m10 .find { display:flex; align-items:center; gap:10px; height:40px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); font-size:13px; } .m10 .find kbd { margin-left:auto; font:400 10px "JetBrains Mono"; padding:2px 7px; border-radius:6px; border:1px solid var(--line); }
.m10 .lbl { margin:16px 4px 6px; font:400 10px "JetBrains Mono"; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
.m10 ul { list-style:none; padding:0; display:flex; flex-direction:column; gap:2px; }
.m10 li a { display:grid; grid-template-columns:22px 1fr auto; gap:12px; align-items:center; height:42px; padding:0 12px; border-radius:10px; color:var(--muted); font:500 15.5px "Exo 2"; transition:.3s; } .m10 kbd { font:400 10px "JetBrains Mono"; padding:2px 6px; border-radius:5px; border:1px solid var(--line); opacity:.7; }
.m10 li a:hover { background:rgba(255,255,255,.05); color:var(--text); } .m10 li.on a { background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent); box-shadow:inset 2px 0 0 var(--accent); }
.m10 .recent { margin-top:auto; border-top:1px solid var(--line); padding-top:10px; display:grid; gap:6px; font-size:12.5px; color:var(--muted); } .m10 .recent div { display:flex; justify-content:space-between; } .m10 .recent b { color:var(--text); font-weight:500; }

/* =====================================================================================================
   11–20: menus that use only the real items (icon and name). The surface and the motion do the work.
   .mm is the shared base: the list fills the card's height, every row takes an equal share.
   ===================================================================================================== */
@property --b { syntax:"<angle>"; inherits:false; initial-value:0deg; }
@keyframes spinb { to { --b:360deg; } } @keyframes rot { to { transform:rotate(360deg); } }
.mm ul { flex:1; list-style:none; padding:0; display:flex; flex-direction:column; position:relative; }
.mm li { flex:1; position:relative; z-index:1; }
.mm li a { height:100%; display:flex; align-items:center; gap:14px; padding:0 18px; color:var(--muted); font:500 16.5px "Exo 2"; transition:color .3s; }
.mm li a:hover, .mm li.on a { color:var(--text); }
.mm li.on svg.i { color:var(--accent); }
.mm .gt { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }

/* 11 · Gliding capsule: one glass capsule travels between the rows with a little spring */
.m11 ul::before { content:""; position:absolute; left:0; right:0; top:4px; height:calc(100%/7 - 8px); z-index:0; border-radius:16px; transform:translateY(calc(var(--i,4)*(100% + 8px))); transition:transform .6s cubic-bezier(.3,1.3,.4,1);
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,transparent),color-mix(in srgb,var(--accent2) 16%,transparent)); border:1px solid color-mix(in srgb,var(--accent) 40%,transparent); box-shadow:0 12px 32px -14px var(--accent),inset 0 1px 0 rgba(255,255,255,.18); }

/* 12 · Pointer spotlight: a soft light follows the pointer through hairline rows; the open row is underlined in light */
.m12 ul::before { content:""; position:absolute; inset:-6px; z-index:0; border-radius:18px; pointer-events:none; opacity:0; transition:opacity .4s;
  background:radial-gradient(220px 160px at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 17%,transparent),transparent 70%); }
.m12 ul:hover::before { opacity:1; }
.m12 li { border-bottom:1px solid var(--line); } .m12 li:last-child { border-bottom:0; }
.m12 li::after { content:""; position:absolute; left:18px; right:18px; bottom:-1px; height:1px; background:linear-gradient(90deg,var(--accent),var(--accent2),transparent); transform:scaleX(0); transform-origin:left; transition:transform .6s cubic-bezier(.2,.8,.2,1); }
.m12 li.on::after { transform:scaleX(1); } .m12 li.on svg.i { filter:drop-shadow(0 0 6px var(--accent)); }

/* 13 · Depth wheel: the open page is large and bright, the others recede by their distance from it */
.m13 ul { justify-content:center; padding-left:6px; }
.m13 li { flex:0 0 auto; }
.m13 li a { height:auto; padding:9px 6px; font:600 24px "Exo 2"; letter-spacing:-.02em; transform-origin:left center; transition:all .55s cubic-bezier(.2,.8,.2,1);
  transform:translateX(calc(var(--d,0)*10px)) scale(calc(1 - var(--d,0)*.09)); opacity:calc(1 - var(--d,0)*.2); filter:blur(calc(var(--d,0)*.5px)); }
.m13 li a:hover { opacity:.95; filter:none; } .m13 svg.i { width:22px; height:22px; }
.m13 li.on .lb, .m15 li.on .lb { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }

/* 14 · Aurora border: slim glass bars, and the open one is framed by a slowly turning ring of colour */
.m14 ul { gap:7px; }
.m14 li a { border-radius:16px; background:rgba(255,255,255,.03); border:1px solid var(--line); position:relative; }
.m14 li.on a { background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent); border-color:transparent; }
.m14 li.on a::before { content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1.5px; background:conic-gradient(from var(--b),var(--accent),var(--violet),var(--accent2),var(--accent)); animation:spinb 5s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }

/* 15 · Accordion focus: the open row grows and the rest give way to it */
.m15 li { transition:flex .6s cubic-bezier(.2,.8,.2,1); border-bottom:1px solid var(--line); } .m15 li:last-child { border-bottom:0; } .m15 li.on { flex:2.2; }
.m15 li a { transition:all .5s cubic-bezier(.2,.8,.2,1); border-radius:16px; } .m15 li.on a { font-size:23px; font-weight:600; background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 15%,transparent),transparent); }
.m15 svg.i { transition:transform .5s cubic-bezier(.2,.8,.2,1); } .m15 li.on svg.i { transform:scale(1.55); margin-right:8px; }

/* 16 · Orbit rail: round nodes joined by a dashed line; the open node has a ring that circles it */
.m16 ul { justify-content:space-between; padding:4px 0; }
.m16 ul::before { content:""; position:absolute; left:19px; top:22px; bottom:22px; border-left:1px dashed var(--line); }
.m16 li { flex:0 0 auto; } .m16 li a { padding:0; gap:16px; height:auto; }

.n35 .sheet { margin:16px -24px 0; flex:1; border-radius:34px 34px 0 0; padding:12px 24px 16px; display:flex; flex-direction:column; background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03)); border-top:1px solid rgba(255,255,255,.16); box-shadow:0 -24px 50px -26px var(--accent); }
.n35 .hnd { display:block; width:42px; height:4px; border-radius:4px; background:rgba(255,255,255,.25); margin:0 auto 6px; } .n35 ul { flex:1; display:flex; flex-direction:column; justify-content:center; }
.n35 li a { display:flex; align-items:center; gap:16px; padding:12px 6px; font:500 17px "Exo 2"; border-bottom:1px solid var(--line); } .n35 li:last-child a { border-bottom:0; }
.n35 li.on a::after { content:""; margin-left:auto; width:9px; height:9px; border-radius:50%; background:var(--accent2); box-shadow:0 0 12px var(--accent2); }

/* 36 · Two panes: an icon strip beside the names, like an editor's activity bar */
.n36 .hd { display:flex; align-items:center; gap:12px; } .n36 .name { margin:0; font-size:21px; text-align:left; } .n36 .sub { margin-top:3px; font-size:9.5px; text-align:left; }
.n36 ul { flex:1; margin:12px 0; border:1px solid var(--line); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; }
.n36 li { flex:1; display:flex; border-bottom:1px solid var(--line); } .n36 li:last-child { border-bottom:0; }
.n36 li a { flex:1; display:grid; grid-template-columns:62px 1fr; align-items:center; font:500 17px "Exo 2"; } .n36 li a svg.i { justify-self:center; width:20px; height:20px; }
.n36 li a::before { content:""; grid-column:1; grid-row:1; align-self:stretch; background:rgba(255,255,255,.03); border-right:1px solid var(--line); } .n36 li a svg.i { grid-column:1; grid-row:1; z-index:1; } .n36 li a .lb { grid-column:2; grid-row:1; padding-left:16px; }
.n36 li.on a { background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent); } .n36 li.on a::before { background:linear-gradient(180deg,var(--accent),var(--accent2)); } .n36 li.on svg.i { color:#0a0a12; }

/* 37 · Magnifier: rows swell toward the pointer like a dock, the open page keeps a lit edge */
.n37 .hd { text-align:center; display:flex; flex-direction:column; align-items:center; } .n37 .name { font-size:25px; margin-top:6px; }
.n37 ul { flex:1; display:flex; flex-direction:column; justify-content:space-evenly; margin:6px 0; } .n37 li { transform-origin:left center; transform:scale(var(--s,1)); transition:transform .18s ease-out; }
.n37 li a { display:flex; align-items:center; gap:14px; height:44px; padding:0 18px; border-radius:14px; font:500 16px "Exo 2"; } .n37 li.on a { background:rgba(255,255,255,.06); box-shadow:inset 3px 0 0 var(--accent); }

/* 38 · Slant: leaning bars like a racing livery; the open one stretches across and takes a colour edge */
.n38 .hd { text-align:center; display:flex; flex-direction:column; align-items:center; } .n38 .name { font-size:26px; margin-top:6px; }
.n38 ul { flex:1; display:flex; flex-direction:column; justify-content:center; gap:7px; margin:8px 0; padding-right:20px; }
.n38 li a { display:flex; align-items:center; gap:14px; height:48px; padding:0 22px; transform:skewX(-14deg); background:rgba(255,255,255,.04); border-left:3px solid var(--line); font:600 16px "Exo 2"; width:78%; transition:.45s cubic-bezier(.2,.8,.2,1); } .n38 li a > * { transform:skewX(14deg); }
.n38 li a:hover { width:88%; } .n38 li.on a { width:calc(100% + 20px); background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,transparent),color-mix(in srgb,var(--accent2) 12%,transparent)); border-left-color:var(--accent); }

/* 39 · Watermark: glass cards with the page's icon enormous and faint behind the name */
.n39 .hd { display:flex; align-items:center; gap:14px; } .n39 .name { margin:0; font-size:23px; text-align:left; } .n39 .sub { text-align:left; margin-top:3px; font-size:9.5px; }
.n39 ul { flex:1; display:flex; flex-direction:column; gap:8px; margin:12px 0; }
.n39 li { flex:1; } .n39 li a { height:100%; position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; padding:0 20px; border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,.035); font:600 19px "Exo 2"; }
.n39 .wm { position:absolute; right:-14px; top:50%; transform:translateY(-50%) rotate(-12deg); opacity:.06; transition:.5s; pointer-events:none; } .n39 .wm svg.i { width:92px; height:92px; stroke-width:1.2; }
.n39 li a:hover .wm { opacity:.14; transform:translateY(-50%) rotate(0deg) scale(1.1); } .n39 li.on a { border-color:color-mix(in srgb,var(--accent) 45%,transparent); background:linear-gradient(110deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent); } .n39 li.on .wm { opacity:.2; color:var(--accent); }
.n28 .act.a,.n28 .act.b{background:rgba(0,0,0,.38);} .n26 li a:hover, .n26 li.on a { color:transparent; }

<body>
<header>
  <div>

  </div>

</header>
<main class="grid" id="grid"></main>
<script>
var IC = {

  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M8 13h8M8 17h8"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',

};
var I = function (k) { return '<svg class="i" viewBox="0 0 24 24">' + IC[k] + '</svg>'; };
var ITEMS = [
  ["Ana səhifə","home","başlanğıc","g h","—"],["Haqqımda","user","mən kiməm","g a","—"],["Təcrübə","work","iş yolum","g e","3 il"],["Layihələr","folder","etdiyim işlər","g p","20+"],
  ["Bacarıqlar","cpu","texnologiyalar","g s","60+"],["Yazılar","pen","fikirlər və qeydlər","g b","8"],["Əlaqə","mail","mənə yaz","g c","—"]
];
var NAMES = ["Numbered index","Two-line items","Big type","Status + learning","Icon tiles","Timeline","Stats + counters","Glass rows","Editorial","Command bar","Gliding capsule","Pointer spotlight","Depth wheel","Aurora border","Accordion focus","Orbit rail","Sliding brackets","Embossed slabs","Inverse pill","Bento",
  "Editorial name","Expanding dock","Mesh banner","Name spine","Dial","Outline type","Right edge","Aurora cloud","Wallet stack","Blueprint grid","Hive","Folder tabs","Full colour","Quiet luxury","Sheet","Two panes","Magnifier","Slant","Watermark"];
function nav(v) {
  var li = function (fn) { return ITEMS.map(function (it, i) { return '<li class="' + (i === 4 ? "on" : "") + '"><a href="#" data-i="' + i + '">' + fn(it, i) + '</a></li>'; }).join(""); };
  var pad = function (i) { return String(i + 1).padStart(2, "0"); };
  switch (v) {
    case 1: return '<nav class="mid m1"><ul>' + li(function (it, i) { return '<span class="no">' + pad(i) + '</span><span class="lb">' + it[0] + '</span><span class="ar">→</span>'; }) + '</ul></nav>';
    case 2: return '<nav class="mid m2"><ul>' + li(function (it) { return '<span class="chip">' + I(it[1]) + '</span><span><b>' + it[0] + '</b><small>' + it[2] + '</small></span>'; }) + '</ul></nav>';
    case 3: return '<nav class="mid m3"><ul>' + li(function (it, i) { return '<span class="lb">' + it[0] + '</span><sup>' + pad(i) + '</sup>'; }) + '</ul></nav>';

    case 5: return '<nav class="mid m5"><ul>' + li(function (it, i) { return I(it[1]) + '<span><b>' + it[0] + '</b><br><small>' + pad(i) + '</small></span>'; }) + '</ul></nav>';
    case 6: return '<nav class="mid m6"><ul>' + li(function (it) { return '<b>' + it[0] + '</b><small>' + it[2] + '</small>'; }) + '</ul></nav>';

    case 8: return '<nav class="mid m8"><ul>' + li(function (it) { return '<span class="chip">' + I(it[1]) + '</span><span>' + it[0] + '</span><span class="ch">›</span>'; }) + '</ul></nav>';
    case 9: return '<nav class="mid m9"><div class="cap"><span>İndeks</span><span>07 səhifə</span></div><ul>' + li(function (it) { return '<span>' + it[0] + '</span><span class="pl">+</span>'; }) + '</ul><div class="cap2"><span>Bakı</span><span>40°24′N 49°52′E</span></div></nav>';
    case 11: case 12: case 13: case 14: case 15: case 17: case 18: case 19: case 20:
      return '<nav class="mid mm m' + v + '"><ul>' + li(function (it) { return I(it[1]) + '<span class="lb">' + it[0] + '</span>'; }) + '</ul></nav>';
    case 16: return '<nav class="mid mm m16"><ul>' + li(function (it) { return '<span class="nd">' + I(it[1]) + '</span><span class="lb">' + it[0] + '</span>'; }) + '</ul></nav>';
    default: return '<nav class="mid m10"><div class="find">' + I("search") + 'Axtar…<kbd>Alt C</kbd></div><div class="lbl">Səhifələr</div><ul>' + li(function (it) { return I(it[1]) + '<span>' + it[0] + '</span><kbd>' + it[3] + '</kbd>'; }) + '</ul><div class="recent"><div><span>Son yeniləmə</span><b>bu gün</b></div><div><span>Dil</span><b>AZ · EN · RU</b></div></div></nav>';
  }
}
function card(v) {
  return '<div class="side"><div class="head"><div class="ava"><i>QQ</i></div><div class="name">Qalib Qurbanov</div><div class="sub">Proqram təminatı tərtibatçısı</div>' +
    '<div class="acts"><span class="act a">' + I("file") + 'CV</span><span class="act b">' + I("send") + 'Mesaj</span></div></div>' + nav(v) +
    '<div class="foot"><div class="soc"><span>GH</span><span>in</span><span>SO</span><span>M</span><span>TG</span></div><div class="copy"><span>© 2026 Qalib Qurbanov</span><span>⚙</span></div></div></div>';
}
/* ---- 21+: whole-card redesigns, each with its own markup ---- */
var LIST = function (fn) { return '<ul>' + ITEMS.map(function (it, i) { return '<li class="' + (i === 4 ? "on" : "") + '" style="--k:' + i + ';--z:' + (i + 1) + '"><a href="#" data-i="' + i + '" data-label="' + it[0] + '">' + fn(it, i) + '</a></li>'; }).join("") + '</ul>'; };
var LBL = function (it) { return I(it[1]) + '<span class="lb">' + it[0] + '</span>'; };
var AV = function (s) { return '<div class="ava" style="width:' + s + 'px;height:' + s + 'px"><i style="font-size:' + Math.round(s * 0.3) + 'px">QQ</i></div>'; };
var NM = '<div class="name">Qalib Qurbanov</div>', SUBT = '<div class="sub">Proqram təminatı tərtibatçısı</div>';
var BTNS = '<div class="acts"><span class="act a">' + I("file") + 'CV</span><span class="act b">' + I("send") + 'Mesaj</span></div>';
var FOOT = '<div class="foot"><div class="soc"><span>GH</span><span>in</span><span>SO</span><span>M</span><span>TG</span></div><div class="copy"><span>© 2026 Qalib Qurbanov</span><span>⚙</span></div></div>';
var HEXAT = [[0, 0], [49, -85], [98, 0], [49, 85], [-49, 85], [-98, 0], [-49, -85]];
function card2(v) {
  var b = '<div class="side n' + v + '">';
  switch (v) {
    case 21: return b + '<div class="top"><div><div class="name">Qalib<br>Qurbanov</div>' + SUBT + '</div>' + AV(46) + '</div>' + LIST(LBL) + '<div class="links"><span>CV ↗</span><span>Mesaj ↗</span></div>' + FOOT + '</div>';
    case 22: return b + '<div class="head">' + AV(64) + NM + SUBT + '</div><div class="stage">' + LIST(LBL) + '</div>' + FOOT + '</div>';
    case 23: return b + '<div class="ban"><div class="mesh"></div></div><div class="body"><div class="avw">' + AV(88) + '</div>' + NM + SUBT + BTNS + LIST(LBL) + FOOT + '</div></div>';
    case 24: return b + '<div class="wrap"><div class="spine"><div class="name">Qalib Qurbanov</div></div><div class="col"><div class="r">' + AV(58) + SUBT + '</div>' + LIST(LBL) + BTNS + '</div></div>' + FOOT + '</div>';
    case 25: return b + '<div class="dial">' + AV(92) + '<ul>' + ITEMS.map(function (it, i) { var a = (-120 + i * 40) * Math.PI / 180, x = 146 + 104 * Math.sin(a), y = 131 - 104 * Math.cos(a);
        return '<li class="' + (i === 4 ? "on" : "") + '" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px"><a href="#" data-i="' + i + '" data-label="' + it[0] + '">' + I(it[1]) + '</a></li>'; }).join("") + '</ul></div><div class="mid2"><div class="dl"></div>' + NM + SUBT + '</div>' + BTNS + FOOT + '</div>';
    case 26: return b + '<div class="hd">' + AV(48) + '<div>' + NM + SUBT + '</div></div>' + LIST(LBL) + BTNS + FOOT + '</div>';
    case 27: return b + '<div class="top">' + AV(58) + NM + SUBT + '</div>' + LIST(LBL) + BTNS + FOOT + '</div>';
    case 28: return b + '<i class="b b1"></i><i class="b b2"></i><i class="b b3"></i><div class="in">' + AV(104) + NM + SUBT + LIST(LBL) + BTNS + FOOT + '</div></div>';
    case 29: return b + '<div class="hd">' + AV(60) + NM + SUBT + '</div>' + LIST(LBL) + BTNS + FOOT + '</div>';
    case 30: return b + '<div class="hd"><div class="name">Qalib<br>Qurbanov</div>' + AV(54) + '</div>' + SUBT + LIST(LBL) + BTNS + FOOT + '</div>';
    case 31: return b + '<div class="hd">' + AV(58) + NM + SUBT + '</div><div class="hive"><ul>' + ITEMS.map(function (it, i) { return '<li class="' + (i === 4 ? "on" : "") + '" style="left:' + HEXAT[i][0] + 'px;top:' + HEXAT[i][1] + 'px"><a href="#" data-i="' + i + '" data-label="' + it[0] + '">' + I(it[1]) + '<span>' + it[0] + '</span></a></li>'; }).join("") + '</ul></div>' + BTNS + FOOT + '</div>';
    case 32: return b + '<div class="top">' + AV(52) + '<div>' + NM + SUBT + '</div></div>' + LIST(LBL) + BTNS + FOOT + '</div>';
    case 33: return b + '<div class="hd">' + AV(80) + NM + SUBT + BTNS + '</div>' + LIST(LBL) + FOOT + '</div>';
    case 34: return b + '<div class="hd">' + AV(44) + '<div>' + NM + SUBT + '</div></div>' + LIST(LBL) + '<div class="links"><span>CV</span><span>Mesaj</span></div>' + FOOT + '</div>';

var grid = document.getElementById("grid");
NAMES.forEach(function (n, k) {
  var f = document.createElement("figure");
  f.innerHTML = '<figcaption><b>' + String(k + 1).padStart(2, "0") + '</b><span>' + n + '</span></figcaption>' + (k < 20 ? card(k + 1) : card2(k + 1));

});
// The index of the open row (--i, for the capsule and the brackets) and every row's distance from it (--d, for the wheel).
function sync(ul) {
  var lis = [].slice.call(ul.children), at = lis.findIndex(function (l) { return l.classList.contains("on"); });
  ul.style.setProperty("--i", at);
  lis.forEach(function (l, i) { l.style.setProperty("--d", Math.abs(i - at)); });
  var dl = ul.closest(".side").querySelector(".dl"); if (dl && lis[at]) dl.textContent = lis[at].querySelector("a").dataset.label;
}
// 37 · the rows swell toward the pointer
grid.addEventListener("mousemove", function (e) {
  var ul = e.target.closest(".n37 ul"); if (!ul) return;
  [].forEach.call(ul.children, function (li) { var r = li.getBoundingClientRect(), d = Math.abs(e.clientY - (r.top + r.height / 2)); li.style.setProperty("--s", (1 + 0.28 * Math.exp(-Math.pow(d / 46, 2))).toFixed(3)); });
});
grid.addEventListener("mouseout", function (e) { var ul = e.target.closest(".n37 ul"); if (ul && !ul.contains(e.relatedTarget)) [].forEach.call(ul.children, function (li) { li.style.setProperty("--s", 1); }); });
grid.querySelectorAll("ul").forEach(sync);
grid.addEventListener("click", function (e) {
  var a = e.target.closest("a[data-i]"); if (!a) return; e.preventDefault();
  var ul = a.closest("ul"); ul.querySelectorAll("li").forEach(function (l) { l.classList.remove("on"); }); a.parentElement.classList.add("on");

// The spotlight in 12 follows the pointer.
grid.addEventListener("mousemove", function (e) {
  var ul = e.target.closest(".m12 ul"); if (!ul) return;

});
document.getElementById("theme").addEventListener("click", function () { var r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; });
</script>
