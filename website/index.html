      /* ---- The opening: shown once per visit, before the site. No box: it is typography on the site's own background (the page gradient with its pools
         of cyan and magenta, and the film grain), led by one huge hollow counter in the style of the home page's big figures, which fills with light from
         the bottom as the page loads. Then it parts like a shutter. Plain HTML and CSS, so it paints at once, before any script. ---- */
      html.intro-on { background: #0a0a12; overflow: hidden; }
      html.intro-on[data-theme="light"] { background: #f5f4fb; }
      #intro { display: none; --ib: #0a0a12; --ia: #00e5ff; --ib2: #ff2e97; --it: #e9e9f5; --im: #9494b0;

        background-image:

          radial-gradient(55% 55% at 100% 100%, color-mix(in srgb, var(--ib2) 11%, transparent), transparent 70%),
          radial-gradient(50% 45% at 45% 110%, color-mix(in srgb, var(--ia) 7%, var(--ib2) 7%), transparent 70%),
          linear-gradient(160deg, color-mix(in srgb, var(--ib) 92%, var(--ia)) 0%, var(--ib) 38%, color-mix(in srgb, var(--ib) 93%, var(--ib2)) 100%);
        transition: transform 0.95s cubic-bezier(0.7, 0, 0.2, 1) 0.85s, box-shadow 0.4s ease 0.85s; will-change: transform; }

          radial-gradient(55% 55% at 6% 108%, color-mix(in srgb, var(--ib2) 14%, transparent), transparent 70%),

      .intro-half.bottom { bottom: 0; background-position: 0 -49.8vh; }

      .intro-dot { position: absolute; left: 0; top: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 9999px; background: #fff; opacity: 0; z-index: 4; pointer-events: none; will-change: transform;

      /* One thin line along the very bottom of the screen carries the progress, with a bright head. */
      .intro-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; margin-bottom: 0; background: color-mix(in srgb, var(--it) 8%, transparent); opacity: 0; animation: intro-up 0.5s ease 0.5s forwards;

      .intro-bar b::after { content: ""; position: absolute; right: -4px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; opacity: calc(1 - var(--hide, 0)); transform: scale(calc(1 - 0.5 * var(--hide, 0))); background: #fff; box-shadow: 0 0 12px var(--ib2), 0 0 24px var(--ia); transition: opacity 0.4s ease; }
      .intro-status { position: absolute; left: 1.5rem; bottom: 1.1rem; font-size: 0.7rem; letter-spacing: 0.1em; color: color-mix(in srgb, var(--ia) 85%, var(--im)); opacity: 0; animation: intro-up 0.5s ease 0.9s forwards; }
      .intro-status::after { content: "_"; margin-left: 2px; animation: intro-blink 0.9s steps(1) infinite; }

      html.intro-open .intro-status { animation: none; opacity: 0; transition: opacity 0.3s ease; }
      html.intro-open .intro-bar { bottom: 50%; margin-bottom: -1px; height: 2px; background-color: transparent; animation: intro-fade 0.05s linear 0.85s both; }
      /* When the halves part, the middle line splits with them: each half carries one half of it as its own edge. */
      .intro-half::before { content: ""; position: absolute; left: 0; right: 0; height: 1px; opacity: 0; z-index: 1; background: linear-gradient(90deg, transparent, var(--ia) 40%, var(--ib2)); }
      .intro-half.top::before { bottom: 0.2vh; }
      .intro-half.bottom::before { top: 0.2vh; }
      html.intro-open .intro-half::before { opacity: 1; transition: opacity 0.05s linear 0.85s; }

      @keyframes intro-fade { from { opacity: 1; } to { opacity: 0; } }
      @keyframes intro-blink { 50% { opacity: 0; } }
    </style>

    <script>
      // The opening is skipped on the root redirect page, the 404 page, for crawlers, for visitors who prefer less motion, and after the first time in a visit.
      (function () {
        var d = document.documentElement;
        var skip = false;
        try {
          skip = window.matchMedia("(prefers-reduced-motion: reduce)").matches || sessionStorage.getItem("intro") === "1";
        } catch (e) {}
        // Search engines, link scanners and speed tests see the page itself, not the opening.
        if (/bot|crawl|spider|lighthouse|prerender|headless/i.test(navigator.userAgent)) skip = true;
        var path = location.pathname;
        if (path === "/" || path === "/index.html" || d.getAttribute("data-page") === "not-found") skip = true;
        var api = { on: !skip, appReady: function () {}, open: null, _open: null };
        if (skip) {
          api.open = Promise.resolve();
        } else {
          d.classList.add("intro-on");
          api.open = new Promise(function (resolve) {
            api._open = resolve;
          });
        }
        window.__intro = api;
      })();
    </script>

          var light = d.getAttribute("data-theme") === "light";
          var colA = hexRgb("--ia", [0, 229, 255]);
          var colB = hexRgb("--ib2", [255, 46, 151]);
          var rgba = function (c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + Math.max(0, a) + ")"; };
          var pts = [];
          var cspeed = 0;
          var calpha = 1;
          var cframe = 0;
          function ribbonTick(now) {
            cframe = 0;
            if (!cg) return;
            var life = 340 + Math.min(480, cspeed * 0.8);
            while (pts.length && now - pts[0].t > life) pts.shift();
            cg.setTransform(csx, 0, 0, csy, 0, 0);
            cg.clearRect(0, 0, CW, CH);
            var n = pts.length;
            if (n > 2) {
              var nr = [];
              for (var i = 0; i < n; i++) {
                var pa = pts[Math.max(0, i - 1)];
                var pb = pts[Math.min(n - 1, i + 1)];
                var nx = -(pb.y - pa.y);
                var ny = pb.x - pa.x;
                var l = Math.hypot(nx, ny) || 1;
                nr.push([nx / l, ny / l]);
              }
              var w = 8;
              var polygon = function (widthAt) {
                cg.beginPath();
                for (var i2 = 0; i2 < n; i2++) {
                  var half = widthAt(i2) * 0.5;
                  var qx = pts[i2].x + nr[i2][0] * half;
                  var qy = pts[i2].y + nr[i2][1] * half;
                  if (i2 === 0) cg.moveTo(qx, qy);
                  else cg.lineTo(qx, qy);
                }
                for (var i3 = n - 1; i3 >= 0; i3--) {
                  var half2 = widthAt(i3) * 0.5;
                  cg.lineTo(pts[i3].x - nr[i3][0] * half2, pts[i3].y - nr[i3][1] * half2);
                }
                cg.closePath();
              };
              var grad = function (a0, a1) {
                var gr = cg.createLinearGradient(pts[0].x, pts[0].y, pts[n - 1].x, pts[n - 1].y);
                gr.addColorStop(0, rgba(colA, 0));
                gr.addColorStop(0.55, rgba(colA, a0));
                gr.addColorStop(1, rgba(colB, a1));
                return gr;
              };
              cg.globalAlpha = calpha;
              if (!light) {
                cg.globalCompositeOperation = "lighter";
                polygon(function (i4) { return Math.pow(i4 / (n - 1), 1.3) * w * 2.4; });
                cg.fillStyle = grad(0.12, 0.2);
                cg.fill();
                cg.globalCompositeOperation = "source-over";
              }
              polygon(function (i5) { return Math.pow(i5 / (n - 1), 1.3) * w; });
              cg.fillStyle = grad(0.55, 0.95);
              cg.fill();
              cg.globalAlpha = 1;
            }
            if (pts.length) cframe = requestAnimationFrame(ribbonTick);
          }
          function placeCursor(px, py, fade, q) {
            var m = skewG.getScreenCTM();
            var sx = m.a * px + m.c * py + m.e;
            var sy = m.b * px + m.d * py + m.f;
            calpha = fade;
            if (dotEl) {
              dotEl.style.transform = "translate3d(" + sx.toFixed(1) + "px," + sy.toFixed(1) + "px,0)";
              dotEl.style.opacity = q >= 1 ? 0 : fade.toFixed(3);
            }
            if (q <= 0 || q >= 1) return;
            var nowT = performance.now();
            var last = pts[pts.length - 1];
            if (last) cspeed += ((Math.hypot(sx - last.x, sy - last.y) / Math.max(1, nowT - last.t)) * 1000 - cspeed) * 0.3;
            pts.push({ x: sx, y: sy, t: nowT });
            if (pts.length > 120) pts.shift();
            if (!cframe) cframe = requestAnimationFrame(ribbonTick);
          }
          write = function (q) {
            var left = Math.max(0, Math.min(1, q)) * sum;
            var pos = P0;
            var fade = 1;
            var past = false;
            for (var k = 0; k < paths.length; k++) paths[k].style.strokeDashoffset = revs[k] * (lens[k] + 1);
            for (var n = 0; n < segs.length; n++) {
              var s = segs[n];
              if (left >= s.w) {
                if (s.t === "d") paths[s.i].style.strokeDashoffset = 0;
                left -= s.w;
                pos = s.t === "d" ? ends[s.i] : s.b;
                if (s.t === "x") { past = true; fade = 0; }
                continue;
              }
              var f2 = left / s.w;
              if (s.t === "a") {
                var u = 0.5 * (f2 * f2 * (3 - 2 * f2)) + 0.5 * (1 - Math.pow(1 - f2, 3));
                fade = Math.min(1, f2 * 4);
                fade = fade * fade * (3 - 2 * fade);
                var v = 1 - u;
                pos = { x: v * v * s.a.x + 2 * v * u * s.c.x + u * u * s.b.x, y: v * v * s.a.y + 2 * v * u * s.c.y + u * u * s.b.y };
              } else if (s.t === "x") {
                var ex = 1 - Math.pow(1 - f2, 3);
                pos = { x: s.a.x + (s.b.x - s.a.x) * ex, y: s.a.y + (s.b.y - s.a.y) * ex };
                fade = 1 - f2 * f2 * (3 - 2 * f2);
                past = true;
              } else if (s.t === "d") {
                var fs2 = 0.35 * (f2 * f2 * (3 - 2 * f2)) + 0.65 * f2;
                var lf = unwarp(s.i, fs2);
                paths[s.i].style.strokeDashoffset = revs[s.i] * (lens[s.i] + 1) * (1 - lf);
                pos = paths[s.i].getPointAtLength(lens[s.i] * (revs[s.i] < 0 ? 1 - lf : lf));
              } else {
                var e = f2 < 0.5 ? 2 * f2 * f2 : 1 - Math.pow(-2 * f2 + 2, 2) / 2;
                pos = { x: s.a.x + (s.b.x - s.a.x) * e, y: s.a.y + (s.b.y - s.a.y) * e };
              }
              break;
            }
            // When the writing is complete the mask is taken off, so every part of every letter (dots, flourishes) is shown whole.
            if (q >= 1 || past) fillG.removeAttribute("mask");
            else if (!fillG.getAttribute("mask")) fillG.setAttribute("mask", "url(#intro-mask)");
            placeCursor(pos.x, pos.y, fade, q);
          };
          write(0);
          var roleEl = document.getElementById("intro-role");
          if (roleEl) roleEl.style.display = "none";
        }
        try {
          fetch("/intro/sign-" + signLang + ".json")
            .then(function (r) {
              if (!r.ok) throw new Error("sign");
              return r.json();
            })
            .then(function (sd) {
              try {
                buildSign(sd);
              } catch (e3) {
                write = null;
              }
              signReady = true;
            })
            .catch(function () {
              signReady = true;
            });
        } catch (e4) {
          signReady = true;
        }
        document.getElementById("intro-role").textContent = t.role;
        document.getElementById("intro-tag").textContent = t.tag;
        var status = document.getElementById("intro-status");
        var numO = document.getElementById("intro-num-o");
        var numF = document.getElementById("intro-num-f");
        // The count starts from nothing: the screen first settles at 000% (HOLD) while its parts come in, and only then climbs. The clock begins at the
        // first drawn frame (not when the script runs), and the number never jumps more than a few points in one frame, even if the page stalls.
        var MIN = 4900;
        var HOLD = 400;
        var begin = 0;
        var shown = 0;
        // The count waits until the counter has finished coming in (its own entrance animation), so it is seen at 000% first.
        var go = false;
        var failAt = performance.now() + 4000;
        var big = document.querySelector(".intro-big");
        if (big) {
          big.addEventListener("animationend", function () {
            go = true;
          }, { once: true });
        }
        var ready = false;
        var finished = false;
        // The pen runs on its own clock, so it moves evenly and gently (slow start, slow end) whatever the loading does, and always finishes before the screen opens.
        var PEN_MS = 4400;
        var penBegin = 0;
        var penDone = false;
        function penTick(now) {
          if (finished) return;
          if (!write) {
            if (signReady || performance.now() > failAt) penDone = true;
            else requestAnimationFrame(penTick);
            return;
          }
          if (!go) {
            requestAnimationFrame(penTick);
            return;
          }
          if (!penBegin) penBegin = now;
          var q = Math.max(0, Math.min(1, (now - penBegin - 150) / PEN_MS));
          write(0.5 * q + 0.5 * (0.5 - 0.5 * Math.cos(Math.PI * q)));
          if (q >= 1) {
            write(1);
            penDone = true;
            return;
          }
          requestAnimationFrame(penTick);
        }
        requestAnimationFrame(penTick);
        api.appReady = function () {
          ready = true;
        };
        function setProgress(p) {
          el.style.setProperty("--p", p.toFixed(2) + "%");
          // Only the bright head dot melts away as the count nears the end, so by 100% it is already gone; the line itself stays.
          var hk = Math.max(0, Math.min(1, (p - 84) / 14));
          el.style.setProperty("--hide", (hk * hk * (3 - 2 * hk)).toFixed(3));
          var digits = ("000" + Math.round(p)).slice(-3);
          numO.textContent = digits;
          numF.textContent = digits;
          var i = p < 40 ? 0 : p < 90 ? 1 : 2;
          if (status.textContent !== t.lines[i]) status.textContent = t.lines[i];
        }
        function open() {
          if (finished) return;
          finished = true;
          setProgress(100);
          d.classList.add("intro-open");
          setTimeout(function () {
            if (api._open) api._open();
          }, 650);
          try {
            sessionStorage.setItem("intro", "1");
          } catch (e) {}
          setTimeout(function () {
            d.classList.remove("intro-on", "intro-open");
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 2000);
        }
        function tick(now) {
          if (finished) return;
          if (!(go && signReady) && performance.now() < failAt) {
            requestAnimationFrame(tick);
            return;
          }
          if (!begin) begin = now;
          var time = now - begin - HOLD;
          var eased = time <= 0 ? 0 : 1 - Math.pow(1 - Math.min(1, time / MIN), 2.4);
          var target = Math.min(eased * 100, ready ? 100 : 92);
          shown = Math.min(target, shown + 3);
          setProgress(shown);
          if ((ready && penDone && time >= MIN && shown >= 99.9) || now - begin > 10000) return open();
          requestAnimationFrame(tick);
        }
        setProgress(0);
        requestAnimationFrame(tick);
      })();
    </script>
