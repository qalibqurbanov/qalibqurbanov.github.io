name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Rebuild every few hours with no commit, so the GitHub numbers baked into the
  # page (first paint, and the fallback when a visitor is rate limited) stay fresh.
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Lets the build read repository stats from the GitHub API without hitting rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The contact form service (see website/.env.example). Both are optional: without them the form opens the visitor's email app.
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_CONTACT_ACCESS_KEY: ${{ secrets.VITE_CONTACT_ACCESS_KEY }}
          VITE_CONTACT_FALLBACK_ENDPOINT: ${{ vars.VITE_CONTACT_FALLBACK_ENDPOINT }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
