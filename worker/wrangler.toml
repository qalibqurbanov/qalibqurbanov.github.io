name = "portfolio-mail"
main = "index.js"
compatibility_date = "2026-10-01"

# Keep the settings entered in the Cloudflare dashboard (RESEND_API_KEY, TO_EMAIL, TURNSTILE_SECRET, FROM_EMAIL).
# This line must stay above the [tables] below: a line placed under a table belongs to it and is ignored.
# Deploy with scripts/upload-mail-sender-to-cloudflare.bat: it also hands the live settings to the deploy again, so none is lost.
keep_vars = true

# No separate preview address for each version: the one workers.dev address is enough.
preview_urls = false

# Keep the logs on (Cloudflare > the Cloudflare Worker > Logs) for finding out why a send failed.
[observability]
enabled = true

# Counts messages per IP address (see waitSeconds in index.js). Wrangler created the namespace on the first deploy.
[[kv_namespaces]]
binding = "RATE"
