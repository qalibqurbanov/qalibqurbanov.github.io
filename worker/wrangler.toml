name = "portfolio-mail"
main = "index.js"
compatibility_date = "2026-10-01"

# No separate preview address for each version: the one workers.dev address is enough.
preview_urls = false

# Keep the logs on (Cloudflare > the Cloudflare Worker > Logs) for finding out why a send failed.
[observability]
enabled = true

# Keep the settings and secrets entered in the Cloudflare dashboard (RESEND_API_KEY, TO_EMAIL, FROM_EMAIL, TURNSTILE_SECRET).
keep_vars = true

# Counts messages per IP address (see underLimit in index.js). Wrangler created the namespace on the first deploy.
[[kv_namespaces]]
binding = "RATE"
